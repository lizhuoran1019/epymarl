# --- MAPPO with GAE specific parameters ---

action_selector: "soft_policies"
mask_before_softmax: True

runner: "parallel"

batch_size_run: 10
buffer_size: 10
batch_size: 10

# update the target network every {} training steps
target_update_interval_or_tau: 0.05

lr: 0.001
hidden_dim: 64

obs_agent_id: True
obs_last_action: False
obs_individual_obs: False

agent_output_type: "pi_logits"
learner: "ppo_learner"
use_rnn: True
standardise_returns: False
standardise_rewards: False
q_nstep: 5 # 1 corresponds to normal r + gammaV (not used when GAE is enabled)
gamma: 0.99

# GAE options
use_gae: True  # Enable Generalized Advantage Estimation
gae_lambda: 0.95  # GAE lambda parameter for bias-variance tradeoff

critic_type: "cv_critic_rnn"
epochs: 4
eps_clip: 0.2
name: "mappo_gae"

t_max: 5001000

# agent: "rnn_2"
# use_layer_norm: True

common_reward: True  # Run experiment with common reward setup
entropy_coef: 0.05
