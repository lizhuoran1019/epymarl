# --- MAPPO specific parameters ---

action_selector: "soft_policies"
mask_before_softmax: True

runner: "parallel"

batch_size_run: 10
buffer_size: 10
batch_size: 10

# update the target network every {} training steps
target_update_interval_or_tau: 0.01

lr: 0.0001
critic_lr: 0.001
hidden_dim: 64

obs_agent_id: True
obs_last_action: True
obs_individual_obs: False

agent_output_type: "pi_logits"
learner: "ppo_learner"
use_rnn: True
standardise_returns: False
standardise_rewards: True
q_nstep: 3 # 1 corresponds to normal r + gammaV
add_value_last_step: False
gamma: 0.99

# GAE options
use_gae: True  # Set to True to enable Generalized Advantage Estimation
gae_lambda: 0.95  # GAE lambda parameter (only used when use_gae=True)

critic_type: "cv_critic_rnn_noise"
epochs: 4
eps_clip: 0.2
name: "mappo_noise"

t_max: 5001000

# agent: "rnn_2"
# use_layer_norm: True

common_reward: True  # Run experiment with common reward setup

noise_dim: 10
noise_scale: 0.5

entropy_coef_start: 0.01
entropy_coef_end: 0.01
entropy_coef_decay_steps: 250

agent: "cnn_rnn"
pg_loss_coef: 1.0  # Coefficient for the policy gradient loss