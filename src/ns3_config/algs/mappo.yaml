# --- MAPPO specific parameters ---

action_selector: "soft_policies"
mask_before_softmax: True

runner: "parallel"

batch_size_run: 10
buffer_size: 10
batch_size: 10

# update the target network every {} training steps
target_update_interval_or_tau: 0.05

lr: 0.01
hidden_dim: 32

obs_agent_id: True
obs_last_action: False
obs_individual_obs: False

agent_output_type: "pi_logits"
learner: "ppo_learner"
use_rnn: True
standardise_returns: False
standardise_rewards: False
q_nstep: 1 # 1 corresponds to normal r + gammaV
add_value_last_step: True
gamma: 0.99

# GAE options
use_gae: False  # Set to True to enable Generalized Advantage Estimation
gae_lambda: 0.95  # GAE lambda parameter (only used when use_gae=True)

critic_type: "cv_critic_rnn"
epochs: 4
eps_clip: 0.3
name: "mappo"

t_max: 5001000

# agent: "rnn_2"
# use_layer_norm: True

common_reward: False  # Run experiment with common reward setup
entropy_coef: 0.02

agent: "cnn_rnn"
pg_loss_coef: 10.0  # Coefficient for the policy gradient loss